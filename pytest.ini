[pytest]
# .claude holds git worktrees, and a worktree is a second checkout of this same repository:
# every test file in it has a basename that already exists here, which pytest refuses to
# import twice, and its copy of the `order_workflow` package shadows the real one on
# sys.path. One left behind produced 148 collection errors and made the full local suite
# unrunnable while CI stayed green, because a fresh clone has no worktrees.
norecursedirs = generated_projects artifacts .opencode_backups local_backups backups node_modules frontend/node_modules .claude
required_plugins = pytest-timeout
timeout = 120
timeout_method = thread
asyncio_default_fixture_loop_scope = function
markers =
    unit: fast isolated tests that do not require external services
    integration: tests that exercise multiple local components together
    external: tests that require network, credentials, or external providers
    slow: tests expected to be slower than the normal unit suite
    browser: tests that require browser automation or browser runtime tooling
    android: tests that require Android tooling, emulator, or device access
    docker: tests that require a running Docker engine
